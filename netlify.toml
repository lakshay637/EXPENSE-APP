# Netlify Deployment Configuration for Expense App

[build]
  command = "npm --prefix frontend install && npm --prefix frontend run build"
  publish = "frontend/dist"

# Redirect /api calls directly to Render Live Backend Web Service
[[redirects]]
  from = "/api/*"
  to = "https://expense-tracker-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) Fallback for React Router v7
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
