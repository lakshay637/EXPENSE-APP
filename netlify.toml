# Netlify Deployment Configuration for Expense App

[build]
  # Subfolder containing frontend React application
  base = "frontend"
  # Build command executed in the base directory
  command = "npm run build"
  # Output directory for production build assets
  publish = "dist"

[functions]
  directory = "../netlify/functions"
  node_bundler = "esbuild"

# Redirect /api calls directly to Render Live Backend Web Service
[[redirects]]
  from = "/api/*"
  to = "https://expense-backend.onrender.com/api/:splat"
  status = 200
  force = false

# Single Page Application (SPA) Fallback for React Router v7
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
