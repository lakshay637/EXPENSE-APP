services:
  # Backend Web Service
  - type: web
    name: expense-tracker-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5050
      - key: DB_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: FORGOT_TOKEN_SECRET
        sync: false
      - key: DOMAIN
        sync: false
      - key: Sender_EMAIL
        sync: false
      - key: Sender_PASSWORD
        sync: false

  # Frontend Static Site
  - type: static
    name: expense-tracker-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BASE_URL
        sync: false

